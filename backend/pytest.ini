[pytest]
pythonpath = .
testpaths = tests
addopts = -q
# Starlette's TestClient emits a deprecation warning about an internal
# anyio alias on this pinned version; it is library noise, not a test
# condition. (Keep real warnings visible — do not blanket-ignore.)
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
